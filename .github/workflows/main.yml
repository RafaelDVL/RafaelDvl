name: Generate profile assets

on:
  schedule:
    # a cada 12 horas (o cron antigo "* */12 * * *" rodava a cada MINUTO durante 2h/dia)
    - cron: "17 3,15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/main.yml"

# necessário para o GITHUB_TOKEN poder fazer push na branch output
permissions:
  contents: write

jobs:
  build:
    name: Gerar guindaste 8-bit + cards de estatísticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guindaste 8-bit (skyline de contribuições)
        run: node scripts/crane.js --user RafaelDVL --out dist

      - name: Cards de estatísticas (substitui github-readme-stats)
        run: node scripts/stats.js --user RafaelDVL --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
